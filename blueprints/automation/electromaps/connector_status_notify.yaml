blueprint:
  name: Electromaps — connector status notification
  description: >-
    Notifies when a connector of up to three Electromaps stations changes
    status (by default when one becomes free), and optionally when a station
    has no free connector left. Pick each station as a device; all of its
    connectors are watched. Your notification action receives `message` (and
    `title`) as variables, e.g. `message: "{{ message }}"`. Restarts and lost
    connections to Electromaps do not cause notifications. Requires the
    Electromaps integration 0.3.0 or later.
  domain: automation
  source_url: https://github.com/fttomas/ha-electromaps/blob/main/blueprints/automation/electromaps/connector_status_notify.yaml
  input:
    stations:
      name: Stations
      icon: mdi:ev-station
      input:
        station_1:
          name: Station 1
          selector:
            device:
              filter:
                - integration: electromaps
        station_2:
          name: Station 2 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
        station_3:
          name: Station 3 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
    notification:
      name: Notification
      icon: mdi:bell-outline
      input:
        notify_on:
          name: Notify when
          default:
            - available
          selector:
            select:
              multiple: true
              options:
                - label: A connector becomes free
                  value: available
                - label: A connector becomes occupied
                  value: occupied
                - label: A connector goes out of service
                  value: out_of_service
                - label: No free connector is left at a station
                  value: none_free
        language:
          name: Message language
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Русский
                  value: ru
                - label: Español
                  value: es
        notify_action:
          name: Notification action
          description: >-
            For example telegram_bot.send_message or notify.mobile_app_* with
            `message: "{{ message }}"`.
          selector:
            action: {}

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: electromaps_connector_status_changed
    id: connector
  - trigger: event
    event_type: electromaps_station_status_changed
    id: station

variables:
  stations:
    - !input station_1
    - !input station_2
    - !input station_3
  notify_on: !input notify_on
  language: !input language
  title: Electromaps
  # Compact messages. Connector label = first two numbers of its name
  # ("Cargador 1 - Toma 2" -> К1·Р2 / C1·S2); status = icon + short word.
  # "Became free" and "no free connector left" add the whole station, one line
  # per charger, read from the sensors (the integration fires its events after
  # the sensors are updated). Other transitions stay two lines. The station
  # name is the device name, so renaming the device shortens it.
  message: >-
    {%- set W = {
      'ru': {'available': 'своб', 'occupied': 'зан', 'out_of_service': 'не раб', 'unknown': '?', 'offline': 'нет связи', 'none': 'Свободных нет', 'was': 'было', 'of': 'из', 'charger': 'Колонка', 'c': 'К', 's': 'Р', 'h': 'ч', 'm': 'м', 'd': 'д'},
      'en': {'available': 'free', 'occupied': 'busy', 'out_of_service': 'down', 'unknown': '?', 'offline': 'offline', 'none': 'No free connectors', 'was': 'was', 'of': 'of', 'charger': 'Charger', 'c': 'C', 's': 'S', 'h': 'h', 'm': 'm', 'd': 'd'},
      'es': {'available': 'libre', 'occupied': 'ocup', 'out_of_service': 'averiado', 'unknown': '?', 'offline': 'sin conexión', 'none': 'Sin conectores libres', 'was': 'antes', 'of': 'de', 'charger': 'Cargador', 'c': 'C', 's': 'T', 'h': 'h', 'm': 'm', 'd': 'd'}
    }[language] -%}
    {%- set icon = {'available': '🟢', 'occupied': '🟠', 'out_of_service': '🧱', 'unknown': '⚪'} -%}
    {%- set d = trigger.event.data -%}
    {%- set station = (device_attr(d.device_id, 'name_by_user') if d.device_id else none) or d.location_name -%}
    {%- set ents = (device_entities(d.device_id) | select('match', 'sensor\\.') | sort | list) if d.device_id else [] -%}
    {%- set dname = (device_attr(d.device_id, 'name_by_user') or device_attr(d.device_id, 'name')) if d.device_id else '' -%}
    {%- set ns = namespace(items=[], free=0) -%}
    {%- for e in ents -%}
      {%- set s = states(e) -%}
      {%- set ns.free = ns.free + (1 if s == 'available' else 0) -%}
      {%- set cname = (state_attr(e, 'friendly_name') or e) | replace(dname ~ ' ', '') -%}
      {%- set nums = cname | regex_findall('\\d+') -%}
      {%- set t = state_attr(e, 'status_since') if s in icon else none -%}
      {%- set dur = '' -%}
      {%- if t -%}
        {%- set m = ((now() - as_datetime(t)).total_seconds() // 60) | int -%}
        {%- set dur = ' ' ~ ((m ~ W.m) if m < 60 else (((m // 60) ~ W.h ~ ' ' ~ (m % 60) ~ W.m) if m < 1440 else ((m // 1440) ~ W.d))) -%}
      {%- endif -%}
      {%- set txt = (icon[s] ~ ' ' ~ W[s] ~ dur) if s in icon else ('⚫ ' ~ W.offline) -%}
      {%- set ns.items = ns.items + [{'col': nums[0] if nums | count >= 2 else '', 'sock': (nums[1] | int) if nums | count >= 2 else 0, 'name': cname, 'txt': txt}] -%}
    {%- endfor -%}
    {%- set blk = namespace(t='⚡ ' ~ station ~ ' — ' ~ W.available ~ ' ' ~ ns.free ~ ' ' ~ W.of ~ ' ' ~ ents | count) -%}
    {%- for col, grp in ns.items | groupby('col') -%}
      {%- if col -%}
        {%- set blk.t = blk.t ~ '\n' ~ W.charger ~ ' ' ~ col ~ ': ' ~ (grp | sort(attribute='sock') | map(attribute='txt') | join(' · ')) -%}
      {%- else -%}
        {%- for i in grp -%}{%- set blk.t = blk.t ~ '\n' ~ i.name ~ ': ' ~ i.txt -%}{%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {%- if trigger.id == 'station' -%}
      {{ '⛔ ' ~ W.none ~ ('\n' ~ blk.t if ents else '') }}
    {%- else -%}
      {%- set nums = d.connector_name | regex_findall('\\d+') -%}
      {%- set label = (W.c ~ nums[0] ~ '·' ~ W.s ~ nums[1]) if nums | count >= 2 else (('#' ~ nums[0]) if nums else d.connector_name) -%}
      {%- set word = W.get(d.to_status, d.to_status) -%}
      {%- set dur = '' -%}
      {%- if d.from_since -%}
        {%- set end = as_datetime(d.since) if d.since else now() -%}
        {%- set m = ((end - as_datetime(d.from_since)).total_seconds() // 60) | int -%}
        {%- set dur = (m ~ W.m) if m < 60 else (((m // 60) ~ W.h ~ ' ' ~ (m % 60) ~ W.m) if m < 1440 else ((m // 1440) ~ W.d)) -%}
      {%- endif -%}
      {%- set prev = (W.was ~ ' ' ~ W.get(d.from_status, d.from_status) ~ ' ' ~ dur) if dur else '' -%}
      {%- set head = icon.get(d.to_status, '⚪') ~ ' ' ~ word[:1] | upper ~ word[1:] ~ ' ' ~ label -%}
      {%- if d.to_status == 'available' and ents -%}
        {{ head ~ ((' · ' ~ prev) if prev else '') ~ '\n' ~ blk.t }}
      {%- else -%}
        {{ head ~ '\n' ~ station ~ ((' · ' ~ prev) if prev else '') }}
      {%- endif -%}
    {%- endif -%}

conditions:
  - condition: template
    value_template: >-
      {%- set d = trigger.event.data -%}
      {%- set watched = d.device_id in (stations | select | list) -%}
      {%- if trigger.id == 'station' -%}
        {{ watched and 'none_free' in notify_on and d.free == 0 and d.free_before > 0 }}
      {%- else -%}
        {{ watched and d.to_status in notify_on }}
      {%- endif -%}

actions: !input notify_action
