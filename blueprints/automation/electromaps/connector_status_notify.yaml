blueprint:
  name: Electromaps — connector status notification
  description: >-
    Notifies when a connector of up to three Electromaps stations changes
    status (by default when one becomes free), and optionally when a station
    has no free connector left. Pick each station as a device; all of its
    connectors are watched. Your notification action receives `message`,
    `message_html` (the same text, each line as monospace <code>, for Telegram
    with parse_mode: html) and `title`, e.g. `message: "{{ message }}"`.
    Restarts and lost connections to Electromaps do not cause notifications.
    Requires the Electromaps integration 0.4.0 or later.
  domain: automation
  source_url: https://github.com/fttomas/ha-electromaps/blob/main/blueprints/automation/electromaps/connector_status_notify.yaml
  input:
    stations:
      name: Stations
      icon: mdi:ev-station
      input:
        station_1:
          name: Station 1
          selector:
            device:
              filter:
                - integration: electromaps
        station_2:
          name: Station 2 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
        station_3:
          name: Station 3 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
    notification:
      name: Notification
      icon: mdi:bell-outline
      input:
        notify_on:
          name: Notify when
          default:
            - available
          selector:
            select:
              multiple: true
              options:
                - label: A connector becomes free
                  value: available
                - label: A connector becomes occupied
                  value: occupied
                - label: A connector goes out of service
                  value: out_of_service
                - label: No free connector is left at a station
                  value: none_free
        language:
          name: Message language
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Русский
                  value: ru
                - label: Español
                  value: es
        notify_action:
          name: Notification action
          description: >-
            For example notify.mobile_app_* with `message: "{{ message }}"`, or
            telegram_bot.send_message with `message: "{{ message_html }}"` and
            `parse_mode: html` for a monospace table.
          selector:
            action: {}

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: electromaps_connector_status_changed
    id: connector
  - trigger: event
    event_type: electromaps_station_status_changed
    id: station

variables:
  stations:
    - !input station_1
    - !input station_2
    - !input station_3
  notify_on: !input notify_on
  language: !input language
  title: Electromaps
  # Every message: station name, "Свободно: нет / 2/4", then one line per
  # charger: "Кол 1:| 🟠 36м    | 🟢 1м    |" (charger/socket = first two
  # numbers of the connector name). "Became free" lists only chargers with a
  # free socket; other messages list all of them. Only the connector sensors
  # are listed (they carry connector_id), not the station's free-count sensor.
  # The connector from the event is shown with the event's own status and
  # time; the others are read from the sensors (the integration fires events
  # after the sensors are updated). `message_html` is the same text with each
  # line in <code> (monospace in Telegram, use parse_mode: html).
  message: >-
    {%- set W = {
      'ru': {'free': 'Свободно', 'no': 'нет', 'col': 'Кол', 'h': 'ч', 'm': 'м', 'd': 'д'},
      'en': {'free': 'Free', 'no': 'none', 'col': 'Ch', 'h': 'h', 'm': 'm', 'd': 'd'},
      'es': {'free': 'Libres', 'no': 'ninguno', 'col': 'Carg', 'h': 'h', 'm': 'm', 'd': 'd'}
    }[language] -%}
    {%- set icon = {'available': '🟢', 'occupied': '🟠', 'out_of_service': '⛔', 'unknown': '⚪'} -%}
    {%- set d = trigger.event.data -%}
    {%- set station = (device_attr(d.device_id, 'name_by_user') if d.device_id else none) or d.location_name -%}
    {%- set ents = (device_entities(d.device_id) | select('match', 'sensor\\.') | sort | list) if d.device_id else [] -%}
    {%- set dname = (device_attr(d.device_id, 'name_by_user') or device_attr(d.device_id, 'name')) if d.device_id else '' -%}
    {%- set ns = namespace(items=[], minm=none, free=0) -%}
    {%- for e in ents if state_attr(e, 'connector_id') is not none -%}
      {%- set own = trigger.id == 'connector' and e == d.entity_id -%}
      {%- set s = d.to_status if own else states(e) -%}
      {%- set ns.free = ns.free + (1 if s == 'available' else 0) -%}
      {%- set cname = (state_attr(e, 'friendly_name') or e) | replace(dname ~ ' ', '') -%}
      {%- set nums = cname | regex_findall('\\d+') -%}
      {%- set t = ((d.since if own else state_attr(e, 'status_since')) if s in icon else none) -%}
      {%- set m = ([((now() - as_datetime(t)).total_seconds() // 60) | int, 0] | max) if t else none -%}
      {%- set dur = '' if m is none else ((m ~ W.m) if m < 60 else (((m // 60) ~ W.h ~ (m % 60) ~ W.m) if m < 1440 else ((m // 1440) ~ W.d))) -%}
      {%- if m is not none and s != 'available' -%}{%- set ns.minm = m if ns.minm is none else [ns.minm, m] | min -%}{%- endif -%}
      {%- set cell = ' ' ~ (icon[s] if s in icon else '⚫') ~ ' ' ~ ('%-6s' | format(dur if s in icon else '—')) -%}
      {%- set ns.items = ns.items + [{'col': nums[0] if nums | count >= 2 else '', 'sock': (nums[1] | int) if nums | count >= 2 else 0, 'name': cname, 's': s, 'cell': cell}] -%}
    {%- endfor -%}
    {%- set only_free = trigger.id == 'connector' and d.to_status == 'available' -%}
    {%- set rows = namespace(l=[]) -%}
    {%- for col, grp in ns.items | groupby('col') -%}
      {%- if col -%}
        {%- if not only_free or 'available' in (grp | map(attribute='s') | list) -%}
          {%- set rows.l = rows.l + [W.col ~ ' ' ~ col ~ ':|' ~ (grp | sort(attribute='sock') | map(attribute='cell') | join('|')) ~ '|'] -%}
        {%- endif -%}
      {%- else -%}
        {%- for i in grp if (not only_free or i.s == 'available') -%}{%- set rows.l = rows.l + [i.name ~ ':|' ~ i.cell ~ '|'] -%}{%- endfor -%}
      {%- endif -%}
    {%- endfor -%}
    {%- set mm = ns.minm -%}
    {%- set since = '' if (mm is none or mm < 1) else (' (' ~ ((mm ~ W.m) if mm < 60 else (((mm // 60) ~ W.h ~ (mm % 60) ~ W.m) if mm < 1440 else ((mm // 1440) ~ W.d))) ~ ')') -%}
    {%- set free_line = W.free ~ ': ' ~ ((W.no ~ since) if ns.free == 0 else (ns.free ~ '/' ~ ns.items | count)) -%}
    {{ ([station] + ([free_line] if ns.items else []) + rows.l) | join('\n') }}
  # Each line as inline <code>: monospace in Telegram without the framed
  # "copy" block that <pre> produces.
  message_html: >-
    {%- for l in message.split('\n') -%}<code>{{ l | e }}</code>{{ '\n' if not loop.last else '' }}{%- endfor -%}

conditions:
  - condition: template
    value_template: >-
      {%- set d = trigger.event.data -%}
      {%- set watched = d.device_id in (stations | select | list) -%}
      {%- if trigger.id == 'station' -%}
        {{ watched and 'none_free' in notify_on and d.free == 0 and d.free_before > 0 }}
      {%- else -%}
        {{ watched and d.to_status in notify_on }}
      {%- endif -%}

actions: !input notify_action
