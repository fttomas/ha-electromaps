blueprint:
  name: Electromaps — connector status notification
  description: >-
    Notifies when a connector of up to three Electromaps stations changes
    status (by default when one becomes free), and optionally when a station
    has no free connector left. Pick each station as a device; all of its
    connectors are watched. Your notification action receives `message` (and
    `title`) as variables, e.g. `message: "{{ message }}"`. Restarts and lost
    connections to Electromaps do not cause notifications. Requires the
    Electromaps integration 0.3.0 or later.
  domain: automation
  source_url: https://github.com/fttomas/ha-electromaps/blob/main/blueprints/automation/electromaps/connector_status_notify.yaml
  input:
    stations:
      name: Stations
      icon: mdi:ev-station
      input:
        station_1:
          name: Station 1
          selector:
            device:
              filter:
                - integration: electromaps
        station_2:
          name: Station 2 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
        station_3:
          name: Station 3 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: electromaps
    notification:
      name: Notification
      icon: mdi:bell-outline
      input:
        notify_on:
          name: Notify when
          default:
            - available
          selector:
            select:
              multiple: true
              options:
                - label: A connector becomes free
                  value: available
                - label: A connector becomes occupied
                  value: occupied
                - label: A connector goes out of service
                  value: out_of_service
                - label: No free connector is left at a station
                  value: none_free
        language:
          name: Message language
          default: en
          selector:
            select:
              options:
                - label: English
                  value: en
                - label: Русский
                  value: ru
                - label: Español
                  value: es
        notify_action:
          name: Notification action
          description: >-
            For example telegram_bot.send_message or notify.mobile_app_* with
            `message: "{{ message }}"`.
          selector:
            action: {}

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: electromaps_connector_status_changed
    id: connector
  - trigger: event
    event_type: electromaps_station_status_changed
    id: station

variables:
  stations:
    - !input station_1
    - !input station_2
    - !input station_3
  notify_on: !input notify_on
  language: !input language
  title: Electromaps
  # Compact, icon-first message. Line 1: new status, station, connector number
  # (digits of its name, "Charger 1 - Socket 2" -> 1.2). Line 2: the whole
  # station as one icon per connector, then the previous status and how long
  # it lasted. The station name is the device name, so renaming the device in
  # Home Assistant shortens it.
  message: >-
    {%- set U = {'en': ['h', 'm', 'd'], 'ru': ['ч', 'м', 'д'], 'es': ['h', 'm', 'd']}[language] -%}
    {%- set icon = {'available': '🟢', 'occupied': '🟠', 'out_of_service': '🔴', 'unknown': '⚪'} -%}
    {%- set d = trigger.event.data -%}
    {%- set station = (device_attr(d.device_id, 'name_by_user') if d.device_id else none) or d.location_name -%}
    {%- set row = namespace(s='') -%}
    {%- if trigger.id == 'station' -%}
      {%- for s in (d.statuses or {}).values() -%}{%- set row.s = row.s ~ icon.get(s, '⚪') -%}{%- endfor -%}
      {{ '⛔ ' ~ station ~ '\n' ~ row.s }}
    {%- else -%}
      {%- for e in (device_entities(d.device_id) | select('match', 'sensor\\.') | sort | list if d.device_id else []) -%}
        {%- set s = d.to_status if e == d.entity_id else states(e) -%}
        {%- set row.s = row.s ~ icon.get(s, '⚫') -%}
      {%- endfor -%}
      {%- set short = d.connector_name | regex_findall('\\d+') | join('.') -%}
      {%- set dur = '' -%}
      {%- if d.from_since -%}
        {%- set end = as_datetime(d.since) if d.since else now() -%}
        {%- set m = ((end - as_datetime(d.from_since)).total_seconds() // 60) | int -%}
        {%- set dur = (m ~ U[1]) if m < 60 else (((m // 60) ~ U[0] ~ ' ' ~ (m % 60) ~ U[1]) if m < 1440 else ((m // 1440) ~ U[2])) -%}
      {%- endif -%}
      {%- set line2 = [row.s, (icon.get(d.from_status, '⚪') ~ ' ' ~ dur) if dur else ''] | select | join(' · ') -%}
      {{ icon.get(d.to_status, '⚪') ~ ' ' ~ station ~ ' · ' ~ (short or d.connector_name) ~ (('\n' ~ line2) if line2 else '') }}
    {%- endif -%}

conditions:
  - condition: template
    value_template: >-
      {%- set d = trigger.event.data -%}
      {%- set watched = d.device_id in (stations | select | list) -%}
      {%- if trigger.id == 'station' -%}
        {{ watched and 'none_free' in notify_on and d.free == 0 and d.free_before > 0 }}
      {%- else -%}
        {{ watched and d.to_status in notify_on }}
      {%- endif -%}

actions: !input notify_action
